<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="380" height="90">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2d6" />
      <stop offset="30%" stop-color="#e8be78" />
      <stop offset="70%" stop-color="#c4974f" />
      <stop offset="100%" stop-color="#8b5e28" />
    </linearGradient>
    <linearGradient id="cubeGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d89f" />
      <stop offset="100%" stop-color="#b88339" />
    </linearGradient>
    <linearGradient id="cubeGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c48e42" />
      <stop offset="100%" stop-color="#734914" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Typography: Solutions -->
  <g filter="url(#glow)">
    <text x="12" y="44" font-family="'Times New Roman', 'Cinzel', 'Georgia', serif" font-size="38" font-style="italic" font-weight="bold" fill="url(#goldGradient)" stroke="#4a2e12" stroke-width="0.8" letter-spacing="1.5">Solutions</text>
    <!-- Typography: Consulting -->
    <text x="14" y="78" font-family="'Times New Roman', 'Cinzel', 'Georgia', serif" font-size="34" font-style="italic" font-weight="bold" fill="url(#goldGradient)" stroke="#4a2e12" stroke-width="0.8" letter-spacing="1.2">Consulting</text>
  </g>

  <!-- Isometric Interlocking Cubes Icon to the right -->
  <g transform="translate(268, 8) scale(0.95)" filter="url(#glow)">
    <!-- Main Center Cube -->
    <!-- Top Face -->
    <polygon points="50,15 80,32 50,49 20,32" fill="url(#cubeGradient1)" stroke="#503312" stroke-width="1.2"/>
    <!-- Left Face -->
    <polygon points="20,32 50,49 50,84 20,67" fill="url(#cubeGradient2)" stroke="#503312" stroke-width="1.2"/>
    <!-- Right Face -->
    <polygon points="50,49 80,32 80,67 50,84" fill="#8f5e22" stroke="#503312" stroke-width="1.2"/>

    <!-- Accent Secondary Interlocking Cube Top Right -->
    <polygon points="75,2 98,15 75,28 52,15" fill="#f8e0b3" fill-opacity="0.85" stroke="#503312" stroke-width="1"/>
    <polygon points="52,15 75,28 75,54 52,41" fill="#d49b4d" fill-opacity="0.85" stroke="#503312" stroke-width="1"/>
    <polygon points="75,28 98,15 98,41 75,54" fill="#a06e2a" fill-opacity="0.85" stroke="#503312" stroke-width="1"/>

    <!-- Connecting Grid Lines -->
    <line x1="20" y1="32" x2="52" y2="15" stroke="#ffd994" stroke-width="1.5" stroke-dasharray="2,2"/>
    <line x1="80" y1="32" x2="98" y2="15" stroke="#ffd994" stroke-width="1.5" stroke-dasharray="2,2"/>
    <circle cx="50" cy="15" r="2.5" fill="#fff" />
    <circle cx="80" cy="32" r="2.5" fill="#fff" />
    <circle cx="20" cy="32" r="2.5" fill="#fff" />
    <circle cx="50" cy="49" r="2.5" fill="#fff" />
    <circle cx="75" cy="2" r="2.5" fill="#fff" />
  </g>
</svg>
